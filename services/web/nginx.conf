# El front tambien hace de reverse proxy hacia la API. Asi Nginx Proxy Manager
# apunta a un unico servicio, el navegador ve un solo origen y no hace falta
# CORS ni exponer la API a la red del proxy.

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Servir los .gz/.br generados en build en vez de comprimir por request.
    gzip_static on;
    gzip_vary on;

    # Cabeceras de seguridad. La CSP puede ser estricta porque no hay CDNs:
    # todo el JS y el CSS son locales.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Datos del panel: nunca cacheados por intermediarios.
        add_header Cache-Control "no-store" always;
    }

    # Los assets llevan hash de contenido solo si se agrega un bundler; por
    # ahora se cachean poco tiempo y se revalidan.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
}
