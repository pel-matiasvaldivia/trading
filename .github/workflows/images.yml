name: Imagenes

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: web
            dockerfile: docker/Dockerfile.web

    steps:
      - uses: actions/checkout@v4

      # QEMU solo hace falta para la arquitectura que no es la del runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 se construye bajo emulacion y es lento. Si el VPS es x86,
          # borrar linux/arm64 corta el tiempo de build a la mitad.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache del registry: sobrevive entre runs y entre ramas, a
          # diferencia del cache local del runner.
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}:buildcache,mode=max
          # buildx genera y adjunta la procedencia y el SBOM a la imagen;
          # no hace falta un paso de atestacion aparte.
          provenance: mode=max
          sbom: true

      - name: Tamano de la imagen
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}:${{ steps.meta.outputs.version }} \
            --format '{{ json . }}' | head -c 2000 || true
