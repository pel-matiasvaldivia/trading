name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest httpx

      - name: Tests
        env:
          PYTHONPATH: src:services/api
        run: pytest -q

      - name: Verificar que el pipeline corre de punta a punta
        env:
          PYTHONPATH: src
          TRADING_DB_PATH: ${{ runner.temp }}/smoke.db
        run: |
          python -m tradingbot demo --shape sine --n 200
          python -m tradingbot --book DEMO_sine backtest --tf 1h
          python -m tradingbot --book DEMO_sine paper --tf 1h
          # El gate sale con codigo 1 cuando el criterio no se cumple, que es
          # lo esperado con datos sinteticos: se verifica que corra, no que
          # apruebe.
          python -m tradingbot --book DEMO_sine gate --tf 1h || true
