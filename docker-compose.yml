# Stack de despliegue. Las imagenes NO se construyen aca: se bajan de GHCR,
# donde las publico GitHub Actions. El VPS solo hace pull y run.
#
#   git pull && docker compose pull && docker compose up -d
#
# La configuracion sale de .env, en este mismo directorio (copiar de
# .env.example). Supuesto: el VPS ya corre Nginx Proxy Manager, que alcanza
# al servicio 'web' por la red 'proxy'; ademas se publican puertos en el
# host, configurables. Ver deploy/README.md.

name: tradingbot

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------
  # Landing + dashboard. Unico servicio visible para NPM: tambien hace de
  # reverse proxy hacia la API, asi el navegador ve un solo origen.
  # ---------------------------------------------------------------------
  web:
    <<: *common
    image: ghcr.io/${GITHUB_REPOSITORY:-pel-matiasvaldivia/trading}-web:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - proxy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=8m
    ports:
      # Puerto externo del servicio. NPM puede seguir alcanzando el
      # contenedor por la red 'proxy'; esto agrega el acceso por host.
      #
      # WEB_BIND decide QUIEN llega: 0.0.0.0 lo publica en todas las
      # interfaces (internet incluida, sin el TLS de NPM), 127.0.0.1 lo
      # limita al propio VPS. Ver la nota en .env.example.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"

  # ---------------------------------------------------------------------
  # API de lectura. No sale a la red proxy: la alcanzan 'web' y, por el
  # puerto publicado abajo, el propio host.
  # ---------------------------------------------------------------------
  api:
    <<: *common
    image: ghcr.io/${GITHUB_REPOSITORY:-pel-matiasvaldivia/trading}-api:${IMAGE_TAG:-latest}
    environment:
      TRADING_DB_PATH: /data/trading.db
      TRADING_BOOK: ${TRADING_BOOK:-usdt_ars}
      STARTING_CASH: ${STARTING_CASH:-33.27}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?definir DASHBOARD_TOKEN en .env}
      # Tienen que ser LOS MISMOS que los del collector: si no, el panel
      # evaluaria una corrida distinta de la que esta operando en papel.
      PAPER_TF: ${PAPER_TF:-1h}
      PAPER_FAST: ${PAPER_FAST:-10}
      PAPER_SLOW: ${PAPER_SLOW:-30}
    volumes:
      # Solo lectura tambien a nivel de Docker: el panel no escribe.
      - trading-data:/data:ro
    networks:
      - internal
    ports:
      # Acceso directo a la API, sin pasar por nginx. Por defecto solo desde
      # el propio VPS (127.0.0.1): sirve para diagnosticar con curl sin
      # abrirla a la red. Cambiar API_BIND a 0.0.0.0 la expone de verdad.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m

  # ---------------------------------------------------------------------
  # Collector: acumula datos de mercado. Es el unico que escribe en el
  # volumen, y el unico que necesita las credenciales de Bitso.
  # ---------------------------------------------------------------------
  collector:
    <<: *common
    image: ghcr.io/${GITHUB_REPOSITORY:-pel-matiasvaldivia/trading}-api:${IMAGE_TAG:-latest}
    command:
      - python
      - -m
      - tradingbot.daemon
      - --book
      - ${TRADING_BOOK:-usdt_ars}
      - --interval
      - ${COLLECT_INTERVAL:-60}
    environment:
      TRADING_DB_PATH: /data/trading.db
      TRADING_BOOK: ${TRADING_BOOK:-usdt_ars}
      STARTING_CASH: ${STARTING_CASH:-33.27}
      # Fase 1: paper trading en vivo dentro de este mismo proceso, para que
      # haya un unico escritor sobre SQLite.
      PAPER_ENABLED: ${PAPER_ENABLED:-1}
      PAPER_TF: ${PAPER_TF:-1h}
      PAPER_FAST: ${PAPER_FAST:-10}
      PAPER_SLOW: ${PAPER_SLOW:-30}
      # Credenciales de SOLO LECTURA. Sin permiso de trading ni de retiro.
      # El collector funciona sin ellas: los endpoints de mercado son publicos.
      BITSO_API_KEY: ${BITSO_API_KEY:-}
      BITSO_API_SECRET: ${BITSO_API_SECRET:-}
    volumes:
      - trading-data:/data
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m

volumes:
  trading-data:

networks:
  internal:
    driver: bridge
  proxy:
    # Red que ya usa Nginx Proxy Manager. Debe existir de antes.
    external: true
    name: ${PROXY_NETWORK:-npm_default}
