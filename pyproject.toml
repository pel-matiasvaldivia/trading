[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Laboratorio de trading algoritmico con contabilidad de costos honesta"
requires-python = ">=3.11"
dependencies = []  # el core corre solo con la biblioteca estandar

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
